<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Redirection...</title>
    <script>
      var l = window.location;
      var redirect = new URL('/', l.origin);
      redirect.searchParams.set('p', l.pathname + l.search + l.hash);
      l.replace(redirect.toString());
    </script>
  </head>
  <body></body>
</html>
